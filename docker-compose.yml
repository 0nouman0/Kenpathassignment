# docker compose up --build
#   -> PostgreSQL on :5432, and the app (API + built React client) on http://localhost:4000
# Values come from the .env file in this folder (see .env.example), with working defaults.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweety}
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sweety} -d ${POSTGRES_DB:-sweety}']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sweety}:${POSTGRES_PASSWORD:-sweety}@db:5432/${POSTGRES_DB:-sweety}
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploying}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # The compose setup is served over plain http://localhost, so the cookie cannot be Secure.
      COOKIE_SECURE: 'false'
    ports:
      - '4000:4000'

volumes:
  pgdata:
