name: Sweety Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sweety
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sweety
          JWT_SECRET: ci_test_jwt_secret_key_at_least_32_characters_long_12345
          NODE_ENV: test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sweety
          JWT_SECRET: ci_test_jwt_secret_key_at_least_32_characters_long_12345
          NODE_ENV: production
